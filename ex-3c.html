<!DOCTYPE html>
<html>
<head>
    <title> HTMLelements in One File</title>


    <style>
        
        p {
            color: green;
        }

       
        #title {
            text-align: center;
            color: purple;
        }

       
        .box {
            background-color: lightpink;
            padding: 10px;
        }

       
        h3 {
            color: blue;
        }
    </style>
</head>
<body>

    
    <h1 style="color: darkorange;">Inline Style Example</h1>

   
    <p>This paragraph uses internal CSS.</p>

    <h2 id="title">Internal Style Using ID Selector</h2>

    <div class="box">This are uses for class selector from internal CSS.</div>

   
    <h3>This heading shows external-style effect</h3>

</body>
</html>
