<!DOCTYPE html>
<html>
<head>
<title>CSS Color Properties</title>

<style>

body{
    font-family:Calibri;
    text-align:center;
    background:#f0f8ff;
}


.textColor{
    color:crimson;
    font-size:28px;
    font-weight:bold;
}


.borderColor{
    width:250px;
    margin:20px auto;
    padding:20px;
    border:5px solid teal;
}

.outlineColor{
    width:250px;
    margin:20px auto;
    padding:20px;
    outline:6px dashed orange;
}

.shadowBox{
    width:250px;
    margin:25px auto;
    padding:20px;
    background:white;
    box-shadow:5px 5px 15px purple;
}


.textShadow{
    font-size:32px;
    color:navy;
    text-shadow:2px 2px 5px gray;
}


table{
    margin:auto;
    border-collapse:collapse;
}

th{
    background:darkblue;
    color:white;
    padding:10px;
}

td{
    background:lightyellow;
    padding:10px;
    border:1px solid gray;
}

tr:nth-child(even){
    background:lightgreen;
}

</style>
</head>

<body>

<h2 class="textColor">Text Color Example</h2>

<div class="borderColor">Border Color Example</div>

<div class="outlineColor">Outline Color Example</div>

<div class="shadowBox">Box Shadow Color</div>

<p class="textShadow">Text Shadow Effect</p>

<h3>Table Color Styling</h3>

<table>
<tr>
<th>Name</th>
<th>Marks</th>
</tr>

<tr>
<td>Ram</td>
<td>85</td>
</tr>

<tr>
<td>Sita</td>
<td>92</td>
</tr>

<tr>
<td>Arjun</td>
<td>78</td>
</tr>
</table>

</body>
</html>
